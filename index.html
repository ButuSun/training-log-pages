[hidden]{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:16px}.layout{display:block}.calendar{gap:5px}.calendar button{height:54px}.calendar button.done{background:#171717;color:white}.calendar button.done[aria-current=date]{outline:2px solid #151515;outline-offset:2px}.calendar button.done[data-selected]{border-color:#fff}.legend{margin:14px 0}.legend strong{font-size:26px;margin:0 4px}

body{background:#fff}main{max-width:880px;padding:30px 28px 120px}header{margin-bottom:32px}section{border:0;border-radius:0;padding:0;background:transparent}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid #eee;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs button{width:160px;display:flex;flex-direction:column;align-items:center;gap:0;border:0;border-radius:0;color:#999;background:none;font-size:13px}
.tabs button span{font-size:27px;line-height:32px}.tabs button[aria-pressed=true]{color:#111;font-weight:700}
.quick-actions{margin:18px 0}.quick-actions button{background:#f3f3f3;border:0;border-radius:24px;padding:10px 18px}
#movement{font-size:23px;font-weight:650;border:0;border-bottom:1px solid #eee;border-radius:0;padding:12px 0}
.form-grid{margin:26px 0;gap:40px}.wheel-shell{border:0}.wheel-shell::before{border-radius:10px;background:#f3f3f3}.wheel div{font-size:23px}
.fields{gap:14px}input,select,textarea{border:0;background:#f5f5f5;border-radius:10px;padding:12px}
#exercise-form>button{width:100%;border:0;background:#eee;padding:12px}#entries{padding:0;list-style:none;margin:24px 0}
#entries li{padding:15px 0;border-bottom:1px solid #eee}#entries button{border:0;color:#666;background:#f4f4f4}
#save{width:100%;padding:13px;min-height:50px;border-radius:12px;margin-top:8px}#note{min-height:85px;margin-top:8px}
.plan-list{grid-template-columns:1fr;margin-top:25px;gap:0}.plan-item{border:0;border-bottom:1px solid #eee;border-radius:0;padding:20px 0;gap:20px}.plan-item::after{content:'记录 ›';margin-left:auto;font-size:14px;color:#777}.illustration{width:72px;height:65px}.plan-item small{margin-top:5px}#schedule{font-size:14px}
.calendar{gap:12px 6px;margin:24px 0}.calendar small{color:#aaa}.calendar button{height:70px;border:0;border-radius:0;font-size:19px;background:none!important;box-shadow:none!important;position:relative}.calendar button.done{color:#222}.calendar button.done .mark{display:grid;place-items:center;width:30px;height:30px;margin:auto;border:1px solid #bbb;border-radius:50%;font-size:17px;color:#333}.calendar button[data-selected]{outline:1px solid #bbb;border-radius:12px}.calendar button[aria-current=date]{font-weight:800;text-decoration:underline;text-underline-offset:6px}.calendar button.done[aria-current=date]{outline:none}.calendar .mark{height:26px}.legend{padding:12px 0;color:#777}.record{border-top:1px solid #eee;padding-top:20px}.record p{line-height:2;font-size:15px}#github-settings{margin-top:36px;font-size:14px;color:#777}#github-form{margin-top:16px}#github-form button{margin:10px 0}
@media(min-width:721px){#exercise-form{max-width:650px;margin:auto}#log-page>label,#entries,#save,#status,.quick-actions{max-width:650px;margin-left:auto;margin-right:auto}#save{display:block}.calendar{gap:16px}.calendar button{height:80px}}
@media(max-width:720px){main{padding:20px 20px 110px}header{margin-bottom:24px}h1{font-size:25px}h2{font-size:20px}header small{font-size:12px}section{padding:0}.line button{font-size:13px;border:0;background:#f5f5f5}.form-grid{grid-template-columns:1fr;gap:22px;margin:20px 0}.fields{grid-template-columns:1fr 1fr 1.2fr;gap:10px}.fields label[style]{grid-column:auto!important}.fields input,.fields select{font-size:18px;min-height:49px;padding:10px}.fields label{font-size:13px;color:#666}.wheel-shell{max-width:100%;margin-top:7px}.wheel{height:160px;padding:60px 0}.wheel-shell::before{inset:60px 0}.wheel div{font-size:25px}#weight-label{font-size:13px;color:#666}.calendar{gap:8px 0;margin:20px -7px}.calendar button{height:65px;font-size:17px}.calendar button.done .mark{width:26px;height:26px;font-size:15px}.plan-list{grid-template-columns:1fr}.tabs button{flex:1;max-width:180px;min-height:52px}#status{font-size:13px}.plan{margin-top:0}}
.form-grid{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,14px);margin:20px 0}
.wheel-label{display:block;font-size:13px;color:#555}
.wheel div{font-size:clamp(14px,4.5vw,23px);white-space:nowrap}
#exercise-form>#movement{width:100%;text-align:left;background:transparent;border-bottom:1px solid #eee;padding-right:38px;position:relative}
#movement::after{content:'⌄';position:absolute;right:12px;color:#666}
#exercise-form>button#add-entry{margin-top:2px}
.entry-meta{color:#555;font-size:14px;margin:3px 0}
.entry-note{white-space:pre-wrap;font-size:14px;margin-top:5px}
.entry-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#entries .entry-actions button{margin:0;min-height:36px;padding:4px 10px}
#entries button:disabled{opacity:.4;cursor:default}
#entries button.remove{color:#a02929}
#cloud-status{max-width:650px;margin:0 auto}
.sheet{box-sizing:border-box;width:min(100%,540px);max-height:88dvh;margin:auto auto 0;border:0;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));color:inherit;box-shadow:0 12px 48px #0003;overscroll-behavior:contain}
.sheet::backdrop{background:#0005}
.sheet[open]{animation:sheet-in .25s cubic-bezier(.22,1,.36,1) both}
.sheet[open]::backdrop{animation:fade-in .22s ease both}
.sheet.closing{animation:sheet-out .19s ease-in both;pointer-events:none}
.sheet.closing::backdrop{animation:fade-in .19s ease reverse both}
@keyframes sheet-in{from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheet-out{to{transform:translateY(26px);opacity:0}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media(min-width:721px){.sheet{margin:auto;border-radius:20px}}

<main>
<header><h1>力量训练</h1><small id="today"></small></header>
<nav class="tabs" aria-label="主导航"><button id="open-log" aria-pressed="true"><span aria-hidden="true">＋</span>训练</button><button id="open-plans" aria-pressed="false"><span aria-hidden="true">☷</span>计划</button><button id="open-checkins" aria-pressed="false"><span aria-hidden="true">▦</span>打卡</button></nav>
<div class="layout">
<section id="checkin-page" aria-labelledby="cal-title" hidden>
<h2 id="cal-title">训练打卡</h2>
<button type="button" id="calendar-plan" style="margin-top:10px">查看训练计划</button>
<div class="line" style="margin-top:10px"><button id="prev" aria-label="上个月">‹</button><strong id="month"></strong><button id="next" aria-label="下个月">›</button></div>
<p class="legend" id="count"></p>
<div class="calendar" id="calendar"></div>
<div class="record"><strong id="record-title"></strong><p id="past" class="muted"></p><button type="button" id="edit-date" style="margin-top:10px">记录这一天</button></div>
</section>
<section id="log-page" class="editor" aria-labelledby="editor-title">
<div class="line"><h2 id="editor-title">记录训练</h2><button id="go-today">回到今天</button></div>
<p id="selected" class="muted" style="margin:5px 0 10px"></p>
<form id="exercise-form">
<button type="button" id="movement" aria-haspopup="dialog">选择动作</button>
<div class="form-grid">
<div><span class="wheel-label" id="weight-label">重量（kg）</span><div class="wheel-shell"><div id="wheel" class="wheel" role="listbox" tabindex="0" aria-labelledby="weight-label"></div></div></div>
<div><span class="wheel-label" id="reps-label">次数</span><div class="wheel-shell"><div id="reps" class="wheel" role="listbox" tabindex="0" aria-labelledby="reps-label"></div></div></div>
<div><span class="wheel-label" id="sets-label">组数</span><div class="wheel-shell"><div id="sets" class="wheel" role="listbox" tabindex="0" aria-labelledby="sets-label"></div></div></div>
<div><span class="wheel-label" id="rpe-label">RPE</span><div class="wheel-shell"><div id="rpe" class="wheel" role="listbox" tabindex="0" aria-labelledby="rpe-label"></div></div></div>
</div>
<label style="margin-top:10px">动作备注<textarea id="exercise-note" rows="2" maxlength="2000" placeholder="记录这个动作的感受或调整"></textarea></label>
<button type="submit" id="add-entry" disabled>添加动作</button>
</form>
<ul id="entries"></ul>
<label>本次备注<textarea id="note" rows="2" maxlength="2000" placeholder="训练感受、降重原因等"></textarea></label>
<button type="button" class="dark" id="save">保存当天训练</button>
<p id="status" class="muted" role="status"></p>
<p id="cloud-status" class="muted" role="status"></p>
</section>
</div>
<section class="plan" id="plan-page" hidden>
<div class="line"><h2>训练计划</h2><select id="plan" aria-label="查看计划" style="width:auto"><option>A</option><option>B</option></select></div>
<p class="muted" id="schedule" style="margin-top:5px"></p>
<div id="plan-list" class="plan-list"></div>
<button type="button" id="export">导出 JSON</button>
</section>
</main>
<dialog class="sheet" id="plan-sheet" aria-labelledby="sheet-title">
<div class="line"><h2 id="sheet-title"></h2><button type="button" id="close-plan">关闭</button></div>
<label style="margin-top:10px">计划<select id="sheet-type" style="width:auto"><option>A</option><option>B</option></select></label>
<div id="sheet-list" class="plan-list"></div>
<form id="custom-form">
<label>自定义动作<input id="custom-movement" required maxlength="60" placeholder="输入动作名称"></label>
<button type="submit" class="dark">使用这个动作</button>
</form>
</dialog>
<script>
const $ = id => document.getElementById(id);
const plans = {
  A: [['深蹲','3 × 8',47.5,8,3],['卧推','3 × 8',42.5,8,3],['杠铃划船','3 × 10',30,10,3],['山羊挺身','2 × 12 · 自重',0,12,2]],
  B: [['硬拉','3 × 6–8',null,6,3],['实力举','4 × 8',null,8,4],['分腿蹲','3 × 每侧 8–10',null,8,3],['高位下拉','3 × 8–10',null,8,3]]
};
const days = ['日','一','二','三','四','五','六'];
const key = 'strength-log-v2';
const publicCacheKey = 'strength-log-public-cache';
const editsKey = 'strength-log-web-edits';
const legacyQueueKey = 'strength-log-github-pending';
const chinaDate = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
const dateAt = iso => new Date(iso + 'T00:00:00Z');
let today = chinaDate.format(new Date());
let selected = today;
let month = selected.slice(0,7);
let calendarDate = selected;
let movement = '';
let sessions = {};
let localEdits = {};
let needsMigration = false;
let draft = [];
let hasChanges = false;
let editing = -1;
try {
  const cached = localStorage.getItem(publicCacheKey);
  needsMigration = cached === null;
  sessions = JSON.parse(cached ?? localStorage.getItem(key) ?? '{}');
  localEdits = JSON.parse(localStorage.getItem(editsKey) || '{}');
  if (needsMigration) {
    const queue = JSON.parse(localStorage.getItem(legacyQueueKey) || '{}');
    for (const [date, entry] of Object.entries(queue)) {
      if (entry?.record && !Object.hasOwn(localEdits,date)) localEdits[date] = entry.record;
    }
  }
  sessions = {...sessions,...localEdits};
} 
catch { $('status').textContent = '无法读取浏览器记录。'; }
function text(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
function weightLabel(value) { return value === 0 ? '自重' : value + ' kg'; }
function describe(exercise) {
  const {name,weight,reps,sets,rpe,note} = exercise;
  return name + ' · ' + weightLabel(weight) + ' × ' + reps + ' 次 × ' + sets + ' 组' +
    (rpe == null ? '' : ' · RPE ' + rpe) + (note ? ' · ' + note : '');
}
function hasTraining(record) {
  return Boolean(record?.exercises.length || (record?.type === 'recovery' && record.note));
}
function renderCalendar() {
  $('today').textContent = today + ' 周' + days[dateAt(today).getUTCDay()];
  const [year, number] = month.split('-').map(Number);
  $('month').textContent = year + ' 年 ' + number + ' 月';
  const count = Object.values(sessions).filter(record =>
    record.date.startsWith(month + '-') && hasTraining(record)
  ).length;
  $('count').replaceChildren(
    month === today.slice(0,7) ? '本月打卡' : '当月打卡',
    text('strong',String(count)), '次'
  );
  const grid = $('calendar');
  grid.replaceChildren(...['一','二','三','四','五','六','日'].map(day => text('small',day)));
  const offset = (dateAt(month + '-01').getUTCDay() + 6) % 7;
  for (let i = 0; i < offset; i++) grid.append(text('span',''));
  const total = new Date(Date.UTC(year, number, 0)).getUTCDate();
  for (let day = 1; day <= total; day++) {
    const iso = month + '-' + String(day).padStart(2,'0');
    const marker = hasTraining(sessions[iso]) ? '✓' : '';
    const button = text('button',String(day));
    button.setAttribute('aria-pressed',String(iso === calendarDate));
    if (marker) button.classList.add('done');
    if (iso === calendarDate) button.setAttribute('data-selected','');
    if (iso === today) button.setAttribute('aria-current','date');
    button.setAttribute('aria-label',iso + (marker ? ' 已打卡' : ''));
    const mark = text('span',marker);
    mark.className = 'mark';
    button.append(mark);
    button.onclick = () => {
      calendarDate = iso;
      renderCalendar();
      grid.querySelector('[data-selected]')?.focus({preventScroll:true});
    };
    grid.append(button);
  }
  $('record-title').textContent = calendarDate + ' 训练记录';
  const record = sessions[calendarDate];
  $('edit-date').hidden = calendarDate > today;
  $('edit-date').textContent = record ? '编辑这一天' : '记录这一天';
  $('past').textContent = record?.exercises.length || record?.note
    ? record.exercises.map(describe).concat(record.note || []).join('\n')
    : '当天暂无记录';
}
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
function createWheel(id, values, format = String) {
  const wheel = $(id);
  const rowHeight = 40;
  let index = 0;
  function select(next) {
    wheel.children[index].setAttribute('aria-selected','false');
    index = Math.max(0, Math.min(values.length - 1, next));
    wheel.children[index].setAttribute('aria-selected','true');
    wheel.setAttribute('aria-activedescendant',wheel.children[index].id);
  }
  function align(smooth = false) {
    wheel.scrollTo({top:index * rowHeight,behavior:smooth && !motionPreference.matches ? 'smooth' : 'instant'});
  }
  function set(value) {
    const next = values.indexOf(value);
    if (next < 0) return;
    select(next);
    align();
  }
  const options = values.map((value, position) => {
    const item = text('div',format(value));
    item.id = id + '-option-' + position;
    item.setAttribute('role','option');
    item.setAttribute('aria-selected','false');
    item.onclick = () => {
      select(position);
      align(true);
    };
    return item;
  });
  wheel.append(...options);
  wheel.addEventListener('scroll', () => {
    if (wheel.clientHeight) select(Math.round(wheel.scrollTop / rowHeight));
  },{passive:true});
  wheel.addEventListener('keydown',event => {
    const step = {ArrowUp:-1,ArrowDown:1,PageUp:-5,PageDown:5}[event.key];
    if (step === undefined && !['Home','End'].includes(event.key)) return;
    event.preventDefault();
    select({Home:0,End:values.length - 1}[event.key] ?? index + step);
    align();
  });
  return {set, align, value:() => values[index]};
}
const weights = Array.from({length:401},(_,index)=>index * 1.25);
const weightWheel = createWheel('wheel',weights,weightLabel);
const repsWheel = createWheel('reps',Array.from({length:999},(_,index)=>index + 1));
const setsWheel = createWheel('sets',Array.from({length:99},(_,index)=>index + 1));
const rpeWheel = createWheel('rpe',[null,...Array.from({length:19},(_,index)=>1 + index / 2)],
  value => value === null ? '选填' : String(value));
function setWeight(weight) {
  const index = Math.max(0,Math.min(weights.length - 1,Math.round(weight / 1.25)));
  weightWheel.set(weights[index]);
}
function setMovement(name) {
  movement = name;
  $('movement').textContent = name || '选择动作';
  $('add-entry').disabled = !name;
}
function moveExercise(from, to) {
  const [item] = draft.splice(from,1);
  draft.splice(to,0,item);
  if (editing === from) editing = to;
  else if (editing === to) editing = from;
  hasChanges = true;
  renderDraft();
}
function renderDraft() {
  $('entries').replaceChildren(...draft.map((item,index) => {
    const li = text('li','');
    const actions = text('div','');
    actions.className = 'entry-actions';
    const edit = text('button','编辑');
    edit.onclick = () => {
      editing = index;
      setMovement(item.name);
      repsWheel.set(item.reps);
      setsWheel.set(item.sets);
      rpeWheel.set(null);
      if (item.rpe != null) rpeWheel.set(Number(item.rpe));
      $('exercise-note').value = item.note ?? '';
      setWeight(item.weight);
      $('add-entry').textContent = '更新动作';
      $('movement').scrollIntoView({block:'center'});
      $('movement').focus({preventScroll:true});
    };
    const up = text('button','上移');
    up.disabled = index === 0;
    up.onclick = () => moveExercise(index,index - 1);
    const down = text('button','下移');
    down.disabled = index === draft.length - 1;
    down.onclick = () => moveExercise(index,index + 1);
    const remove = text('button','删除');
    remove.className = 'remove';
    remove.onclick = () => {
      if (!confirm('确定删除「' + item.name + '」这条动作记录？')) return;
      draft.splice(index,1);
      if (editing === index) resetForm();
      else if (editing > index) editing--;
      hasChanges = true;
      renderDraft();
    };
    for (const button of [edit,up,down,remove]) {
      button.type = 'button';
      button.setAttribute('aria-label',button.textContent + ' ' + item.name);
    }
    actions.append(edit,up,down,remove);
    const meta = text('p',describe({...item,note:''}).slice(item.name.length + 3));
    meta.className = 'entry-meta';
    li.append(text('strong',item.name),meta);
    if (item.note) {
      const note = text('p',item.note);
      note.className = 'entry-note';
      li.append(note);
    }
    li.append(actions);
    return li;
  }));
}
function resetForm() {
  editing = -1;
  $('exercise-form').reset();
  setMovement('');
  $('add-entry').textContent = '添加动作';
  setWeight(0);
  repsWheel.set(8);
  setsWheel.set(3);
  rpeWheel.set(null);
}
function choose(iso, moveMonth = true) {
  if ((hasChanges || movement) && !confirm('这一天还有未保存的修改，切换日期？')) return false;
  selected = iso;
  if (moveMonth) {
    month = iso.slice(0,7);
    calendarDate = iso;
  }
  const record = sessions[iso];
  draft = (record?.exercises || []).slice();
  $('note').value = record?.note || '';
  hasChanges = false;
  $('status').textContent = '';
  $('selected').textContent = iso + ' 周' + days[dateAt(iso).getUTCDay()];
  resetForm();
  renderDraft();
  renderCalendar();
  return true;
}
function applyPlan([name,,weight,reps,sets]) {
  setMovement(name);
  repsWheel.set(reps);
  setsWheel.set(sets);
  setWeight(weight ?? 0);
}
function planItems(type, onPick) {
  return plans[type].map((entry,index) => {
    const [name,scheme] = entry;
    const row = text(onPick ? 'button' : 'div','');
    row.className = onPick ? 'plan-item' : 'plan-preview';
    const icon = text('span','');
    icon.className = 'illustration';
    icon.setAttribute('aria-hidden','true');
    icon.style.backgroundPosition = (index*100/3) + '% ' + (type === 'A' ? 0 : 100) + '%';
    const label = text('span',name);
    label.append(text('small',scheme));
    row.append(icon,label);
    if (onPick) {
      row.type = 'button';
      row.onclick = () => onPick(entry);
    }
    return row;
  });
}
function renderPlan() {
  $('schedule').textContent = '按当天实际训练选择 A 或 B，也可以填写其他动作。';
  $('plan-list').replaceChildren(...planItems($('plan').value,entry => {
    openPage('log');
    resetForm();
    applyPlan(entry);
    $('movement').focus();
  }));
}
const planSheet = $('plan-sheet');
let picking = false;
let sheetTrigger;
function closePlan() {
  if (planSheet.classList.contains('closing')) return;
  if (motionPreference.matches) {
    planSheet.close();
    return;
  }
  planSheet.classList.add('closing');
  const animation = planSheet.getAnimations().find(item => item.animationName === 'sheet-out');
  if (animation) animation.finished.then(() => planSheet.close(), () => planSheet.close());
  else planSheet.close();
}
function renderSheet() {
  const pick = picking ? entry => {
    if (editing < 0) applyPlan(entry);
    else setMovement(entry[0]);
    closePlan();
  } : null;
  $('sheet-list').replaceChildren(...planItems($('sheet-type').value,pick));
}
function openPlan(isPicking, trigger) {
  picking = isPicking;
  sheetTrigger = trigger;
  $('sheet-title').textContent = picking ? '选择动作' : '训练计划';
  $('sheet-type').value = $('plan').value;
  $('custom-form').hidden = !picking;
  $('custom-form').reset();
  renderSheet();
  planSheet.showModal();
  $('close-plan').focus();
}
$('movement').onclick = event => openPlan(true,event.currentTarget);
$('calendar-plan').onclick = event => openPlan(false,event.currentTarget);
$('sheet-type').onchange = renderSheet;
$('close-plan').onclick = closePlan;
planSheet.addEventListener('cancel',event => {
  event.preventDefault();
  closePlan();
});
planSheet.addEventListener('click',event => {
  if (event.target !== planSheet) return;
  const {left,top,right,bottom} = planSheet.getBoundingClientRect();
  if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) closePlan();
});
planSheet.addEventListener('close',() => {
  planSheet.classList.remove('closing');
  sheetTrigger?.focus({preventScroll:true});
});
$('custom-form').onsubmit = event => {
  event.preventDefault();
  const name = $('custom-movement').value.trim();
  if (!name) return;
  setMovement(name);
  closePlan();
};
$('edit-date').onclick = () => {
  if (calendarDate === selected || choose(calendarDate,false)) openPage('log');
};
function moveMonth(delta) {
  const date = dateAt(month + '-01');
  date.setUTCMonth(date.getUTCMonth() + delta);
  month = date.toISOString().slice(0,7);
  renderCalendar();
}
$('prev').onclick = () => moveMonth(-1);
$('next').onclick = () => moveMonth(1);
$('go-today').onclick = () => choose(today);
$('plan').onchange = renderPlan;
$('note').oninput = () => {hasChanges = true;};
$('exercise-form').onsubmit = event => {
  event.preventDefault();
  if (!movement) return;
  const entry = {
    name:movement,weight:weightWheel.value(),reps:repsWheel.value(),sets:setsWheel.value(),
    rpe:rpeWheel.value(),note:$('exercise-note').value.trim()
  };
  const isNew = editing < 0;
  if (isNew) draft.push(entry);
  else draft[editing] = {...draft[editing],...entry};
  hasChanges = true;
  resetForm();
  renderDraft();
  $('status').textContent = isNew ? '动作已添加。' : '动作已更新。';
};
function saveLocalEdit(record) {
  const next = {...localEdits,[record.date]:record};
  try {
    localStorage.setItem(editsKey,JSON.stringify(next));
  } catch {
    $('status').textContent = '浏览器保存失败。';
    return;
  }
  localEdits = next;
  sessions = {...sessions,[record.date]:record};
  hasChanges = false;
  renderCalendar();
  $('status').textContent = '已保存到此浏览器。';
}
$('save').onclick = () => {
  if (movement) { $('status').textContent = '请先添加或更新正在填写的动作。'; return; }
  if (!draft.length && !sessions[selected]) { $('status').textContent = '请先添加至少一个动作。'; return; }
  if (selected > today) { $('status').textContent = '训练完成后才可保存到日历。'; return; }
  const record = {...sessions[selected],date:selected,exercises:draft.slice(),note:$('note').value.trim()};
  saveLocalEdit(record);
};
$('export').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify({sessions:Object.values(sessions)},null,2)],{type:'application/json'}));
  const link = text('a','');
  link.href = url;
  link.download = 'training-history.json';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
let refreshing = false;
let lastRefresh = 0;
async function refreshPublicRecords() {
  if (document.hidden || refreshing || Date.now() - lastRefresh < 10000) return;
  refreshing = true;
  lastRefresh = Date.now();
  try {
    const response = await fetch('./training-history.json',{cache:'no-cache',signal:AbortSignal.timeout(15000)});
    if (!response.ok) throw Error('训练记录加载失败');
    const data = await response.json();
    if (!Array.isArray(data.sessions)) throw Error('训练记录格式错误');
    const incoming = Object.create(null);
    for (const record of data.sessions) {
      if (!record || !/^\d{4}-\d{2}-\d{2}$/.test(record.date) ||
          !Array.isArray(record.exercises) || Object.hasOwn(incoming,record.date)) {
        throw Error('训练记录包含无效或重复日期');
      }
      incoming[record.date] = record;
    }
    if (needsMigration) {
      for (const [date, record] of Object.entries(sessions)) {
        if (!Object.hasOwn(incoming,date) && !Object.hasOwn(localEdits,date)) localEdits[date] = record;
      }
      try {
        localStorage.setItem(editsKey,JSON.stringify(localEdits));
        needsMigration = false;
      } catch {}
    }
    if (!needsMigration) {
      try { localStorage.setItem(publicCacheKey,JSON.stringify(incoming)); } catch {}
    }
    const merged = {...incoming,...localEdits};
    const selectedChanged = JSON.stringify(merged[selected]) !== JSON.stringify(sessions[selected]);
    sessions = merged;
    if (selectedChanged && !hasChanges && !movement && !$('exercise-note').value) choose(selected,false);
    else renderCalendar();
    $('cloud-status').textContent = '';
  } catch {
    $('cloud-status').textContent = '暂时无法读取公开训练记录，稍后会自动重试。';
  } finally {
    refreshing = false;
  }
}
window.addEventListener('online',refreshPublicRecords);
window.addEventListener('focus',refreshPublicRecords);
document.addEventListener('visibilitychange',refreshPublicRecords);
setInterval(refreshPublicRecords,60000);
function refreshToday() {
  const current = chinaDate.format(new Date());
  if (current === today) return;
  today = current;
  renderCalendar();
}
document.addEventListener('visibilitychange',refreshToday);
setInterval(refreshToday,30000);
function openPage(page) {
  $('checkin-page').hidden = page !== 'checkins';
  $('log-page').hidden = page !== 'log';
  $('plan-page').hidden = page !== 'plans';
  for (const name of ['log','plans','checkins']) {
    $('open-' + name).setAttribute('aria-pressed',String(page === name));
  }
  if (page === 'checkins') renderCalendar();
  else if (page === 'log') {
    for (const wheel of [weightWheel,repsWheel,setsWheel,rpeWheel]) wheel.align();
  }
  window.scrollTo({top:0,behavior:'instant'});
}
$('open-log').onclick = () => openPage('log');
$('open-plans').onclick = () => openPage('plans');
$('open-checkins').onclick = () => openPage('checkins');
renderPlan();
choose(today);
refreshPublicRecords();
</script>
</html>
