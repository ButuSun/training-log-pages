[hidden]{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:16px}.layout{display:block}.calendar{gap:5px}.calendar button{height:54px}.calendar button.done{background:#171717;color:white}.calendar button.done[aria-current=date]{outline:2px solid #151515;outline-offset:2px}.calendar button.done[data-selected]{border-color:#fff}.legend{margin:14px 0}.legend strong{font-size:26px;margin:0 4px}

body{background:#fff}main{max-width:880px;padding:30px 28px 120px}header{margin-bottom:32px}section{border:0;border-radius:0;padding:0;background:transparent}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:rgba(255,255,255,.97);border-top:1px solid #eee;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs button{width:160px;display:flex;flex-direction:column;align-items:center;gap:0;border:0;border-radius:0;color:#999;background:none;font-size:13px}
.tabs button span[aria-hidden=true]{font-size:27px;line-height:32px}.tabs button[aria-pressed=true]{color:#111;font-weight:700}
.quick-actions{margin:18px 0}.quick-actions button{background:#f3f3f3;border:0;border-radius:24px;padding:10px 18px}
#movement{font-size:23px;font-weight:650;border:0;border-bottom:1px solid #eee;border-radius:0;padding:12px 0}
.form-grid{margin:26px 0;gap:40px}.wheel-shell{border:0}.wheel-shell::before{border-radius:10px;background:#f3f3f3}.wheel div{font-size:23px}
.fields{gap:14px}input,select,textarea{border:0;background:#f5f5f5;border-radius:10px;padding:12px}
#exercise-form>button{width:100%;border:0;background:#eee;padding:12px}#entries{padding:0;list-style:none;margin:24px 0}
#entries li{padding:15px 0;border-bottom:1px solid #eee}#entries button{border:0;color:#666;background:#f4f4f4}
#save{width:100%;padding:13px;min-height:50px;border-radius:12px;margin-top:8px}#note{min-height:85px;margin-top:8px}
.plan-list{grid-template-columns:1fr;margin-top:25px;gap:0}.plan-item{border:0;border-bottom:1px solid #eee;border-radius:0;padding:20px 0;gap:20px}.plan-item::after{content:'记录 ›';margin-left:auto;font-size:14px;color:#777}.illustration{width:72px;height:65px}.plan-item small{margin-top:5px}#schedule{font-size:14px}
.calendar{gap:12px 6px;margin:24px 0}.calendar small{color:#aaa}.calendar button{height:70px;border:0;border-radius:0;font-size:19px;background:none!important;box-shadow:none!important;position:relative}.calendar button.done{color:#222}.calendar button.done .mark{display:grid;place-items:center;width:30px;height:30px;margin:auto;border:1px solid #bbb;border-radius:50%;font-size:17px;color:#333}.calendar button[data-selected]{outline:1px solid #bbb;border-radius:12px}.calendar button[aria-current=date]{font-weight:800;text-decoration:underline;text-underline-offset:6px}.calendar button.done[aria-current=date]{outline:none}.calendar .mark{height:26px}.legend{padding:12px 0;color:#777}#github-settings{margin-top:36px;font-size:14px;color:#777}#github-form{margin-top:16px}#github-form button{margin:10px 0}
@media(min-width:721px){#exercise-form{max-width:650px;margin:auto}#training-editor>label,#entries,#save,#status,.quick-actions{max-width:650px;margin-left:auto;margin-right:auto}#save{display:block}.calendar{gap:16px}.calendar button{height:80px}}
@media(max-width:720px){main{padding:20px 20px 110px}header{margin-bottom:24px}h1{font-size:25px}h2{font-size:20px}header small{font-size:12px}section{padding:0}.line button{font-size:13px;border:0;background:#f5f5f5}.form-grid{grid-template-columns:1fr;gap:22px;margin:20px 0}.fields{grid-template-columns:1fr 1fr 1.2fr;gap:10px}.fields label[style]{grid-column:auto!important}.fields input,.fields select{font-size:18px;min-height:49px;padding:10px}.fields label{font-size:13px;color:#666}.wheel-shell{max-width:100%;margin-top:7px}.wheel{height:160px;padding:60px 0}.wheel-shell::before{inset:60px 0}.wheel div{font-size:25px}#weight-label{font-size:13px;color:#666}.calendar{gap:8px 0;margin:20px -7px}.calendar button{height:65px;font-size:17px}.calendar button.done .mark{width:26px;height:26px;font-size:15px}.plan-list{grid-template-columns:1fr}.tabs button{flex:1;max-width:180px;min-height:52px}#status{font-size:13px}.plan{margin-top:0}}
.form-grid{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,14px);margin:20px 0}
.wheel-label{display:block;font-size:13px;color:#555}
.wheel div{font-size:clamp(14px,4.5vw,23px);white-space:nowrap}
#exercise-form>#movement{width:100%;text-align:left;background:transparent;border-bottom:1px solid #eee;padding-right:38px;position:relative}
#movement::after{content:'⌄';position:absolute;right:12px;color:#666}
#exercise-form>button#add-entry{margin-top:2px}
.entry-meta{color:#555;font-size:14px;margin:3px 0}
.entry-note{white-space:pre-wrap;font-size:14px;margin-top:5px}
.entry-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#entries .entry-actions button{margin:0;min-height:36px;padding:4px 10px}
#entries button:disabled{opacity:.4;cursor:default}
#entries button.remove{color:#333}
#cloud-status{max-width:650px;margin:0 auto}
.sheet{box-sizing:border-box;width:min(100%,540px);max-height:88dvh;margin:auto auto 0;border:0;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));color:inherit;box-shadow:0 12px 48px #0003;overscroll-behavior:contain}
.sheet::backdrop{background:#0005}
.sheet[open]{animation:sheet-in .25s cubic-bezier(.22,1,.36,1) both}
.sheet[open]::backdrop{animation:fade-in .22s ease both}
.sheet.closing{animation:sheet-out .19s ease-in both;pointer-events:none}
.sheet.closing::backdrop{animation:fade-in .19s ease reverse both}
@keyframes sheet-in{from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheet-out{to{transform:translateY(26px);opacity:0}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

<script>
const $ = id => document.getElementById(id);
const plans = {
  A: [['深蹲','3 × 8',47.5,8,3],['卧推','3 × 8',42.5,8,3],['杠铃划船','3 × 10',30,10,3],['山羊挺身','2 × 12 · 自重',0,12,2]],
  B: [['硬拉','3 × 6–8',null,6,3],['实力举','4 × 8',null,8,4],['分腿蹲','3 × 每侧 8–10',null,8,3],['高位下拉','3 × 8–10',null,8,3]]
};
const days = ['日','一','二','三','四','五','六'];
const key = 'strength-log-v2';
const publicCacheKey = 'strength-log-public-cache';
const editsKey = 'strength-log-web-edits';
const legacyQueueKey = 'strength-log-github-pending';
const workerApi = 'https://butusun-training-api.sunburgerbo.workers.dev';
const workerPasswordKey = 'strength-log-cloud-password-session';
const persistentPasswordKey = 'strength-log-cloud-password';
let cloudPassword = '';
try {
  cloudPassword = localStorage.getItem(persistentPasswordKey) || sessionStorage.getItem(workerPasswordKey) || '';
  if (cloudPassword) localStorage.setItem(persistentPasswordKey,cloudPassword);
} catch {
  try { cloudPassword = sessionStorage.getItem(workerPasswordKey) || ''; } catch {}
}
const draftKey = 'strength-log-editor-drafts-v1';
let editorDrafts = {};
let draftsReady = false;
try {
  const saved = JSON.parse(localStorage.getItem(draftKey) || '{}');
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) editorDrafts = saved;
} catch {}
let cloudBusy = false;
let cloudSyncPromise = null;
const chinaDate = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});
const dateAt = iso => new Date(iso + 'T00:00:00Z');
let today = chinaDate.format(new Date());
let selected = today;
let month = selected.slice(0,7);
let calendarDate = selected;
let movement = '';
let sessions = {};
let localEdits = {};
let needsMigration = false;
let draft = [];
let hasChanges = false;
let editing = -1;
try {
  const cached = localStorage.getItem(publicCacheKey);
  needsMigration = cached === null;
  sessions = JSON.parse(cached ?? localStorage.getItem(key) ?? '{}');
  localEdits = JSON.parse(localStorage.getItem(editsKey) || '{}');
  if (needsMigration) {
    const queue = JSON.parse(localStorage.getItem(legacyQueueKey) || '{}');
    for (const [date, entry] of Object.entries(queue)) {
      if (entry?.record && !Object.hasOwn(localEdits,date)) localEdits[date] = entry.record;
    }
  }
  sessions = {...sessions,...localEdits};
} 
catch { $('status').textContent = '无法读取浏览器记录。'; }
function text(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
function weightLabel(value) { return value === 0 ? '自重' : value + ' kg'; }
function exerciseRow({name,weight,reps,sets,rpe,note}) {
  const row = text('li','');
  const meta = text('p',weightLabel(weight) + ' × ' + reps + ' 次 × ' + sets + ' 组' +
    (rpe == null ? '' : ' · RPE ' + rpe));
  meta.className = 'entry-meta';
  row.append(text('strong',name),meta);
  if (note) {
    const remark = text('p',note);
    remark.className = 'entry-note';
    row.append(remark);
  }
  return row;
}
function hasTraining(record) {
  return Boolean(record?.exercises.length || (record?.type === 'recovery' && record.note));
}
function renderCalendar() {
  renderHomeState();
  const [year, number] = month.split('-').map(Number);
  $('month').textContent = year + ' 年 ' + number + ' 月';
  $('this-month').hidden = month === today.slice(0,7);
  const count = Object.values(sessions).filter(record =>
    record.date.startsWith(month + '-') && hasTraining(record)
  ).length;
  $('count').replaceChildren(
    month === today.slice(0,7) ? '本月打卡' : '当月打卡',
    text('strong',String(count)), '次'
  );
  const grid = $('calendar');
  grid.replaceChildren(...['一','二','三','四','五','六','日'].map(day => text('small',day)));
  const offset = (dateAt(month + '-01').getUTCDay() + 6) % 7;
  for (let i = 0; i < offset; i++) grid.append(text('span',''));
  const total = new Date(Date.UTC(year, number, 0)).getUTCDate();
  for (let day = 1; day <= total; day++) {
    const iso = month + '-' + String(day).padStart(2,'0');
    const marker = hasTraining(sessions[iso]) ? '✓' : '';
    const button = text('button',String(day));
    button.dataset.date = iso;
    button.setAttribute('aria-haspopup','dialog');
    if (marker) button.classList.add('done');
    if (iso === calendarDate) button.setAttribute('data-selected','');
    if (iso === today) button.setAttribute('aria-current','date');
    button.setAttribute('aria-label',iso + (marker ? ' 已打卡' : ''));
    const mark = text('span',marker);
    mark.className = 'mark';
    button.append(mark);
    button.onclick = () => openDay(iso);
    grid.append(button);
  }
  if (daySheet.open) renderDaySummary();
  if (!$('plan-page').hidden) renderPlan();
}
let wheelDraftTimer;
function scheduleWheelDraft() {
  clearTimeout(wheelDraftTimer);
  wheelDraftTimer = setTimeout(persistEditorDraft,180);
}
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
function createWheel(id, values, format = String) {
  const wheel = $(id);
  const rowHeight = 40;
  let index = 0;

  for(const record of data.sessions){
    if(!record||!/^\d{4}-\d{2}-\d{2}$/.test(record.date)||!Array.isArray(record.exercises))throw new Error('云端记录无效');
    incoming[record.date]=record;
  }
  try{localStorage.setItem(publicCacheKey,JSON.stringify(incoming))}catch{}
  const merged = {...incoming,...localEdits};
  const selectedChanged = JSON.stringify(merged[selected]) !== JSON.stringify(sessions[selected]);
  sessions = merged;
  if (selectedChanged && !editorDirty() && !$('save').disabled) loadEditorDate(selected);
  else renderCalendar();
}
async function syncPendingEdits(){
  if(!cloudPassword || !navigator.onLine)return false;
  // 等正在执行的同步完成，避免点击保存时被自动刷新跳过。
  if(cloudSyncPromise) {
    const previous = await cloudSyncPromise;
    if(!Object.keys(localEdits).length)return previous;
    if(!previous)return false;
  }
  const operation=(async()=>{
    cloudBusy=true;
    try{
      const remote=await cloudRequest('/api/history');
      mergeCloudRecords(remote);
      // 逐条写入，避免覆盖其他设备的历史记录。
      while(Object.keys(localEdits).length){
        const [date,record]=Object.entries(localEdits)[0];
        await cloudRequest('/api/session',{method:'PUT',body:JSON.stringify(record)});
        if(JSON.stringify(localEdits[date])===JSON.stringify(record)){
          delete localEdits[date];
          localStorage.setItem(editsKey,JSON.stringify(localEdits));
        }
      }
      const updated=await cloudRequest('/api/history');
      mergeCloudRecords(updated);
      $('cloud-status').textContent='✓ 云端已同步';
      return true;
    }catch(e){
      $('cloud-status').textContent='同步失败，本机记录已保留：'+e.message;
      return false;
    }finally{cloudBusy=false}
  })();
  cloudSyncPromise=operation;
  try{return await operation}
  finally{if(cloudSyncPromise===operation)cloudSyncPromise=null}
}
async function connectCloud(){
  if(cloudBusy)return;
  const password=prompt('请输入云端密码，验证后会在此浏览器保持登录');
  if(password===null)return;
  if(!password){$('cloud-status').textContent='密码不能为空';return}
  const previousPassword = cloudPassword;
  cloudPassword=password;
  try{
    const remote=await cloudRequest('/api/history');
    try {
      localStorage.setItem(persistentPasswordKey,password);
      sessionStorage.setItem(workerPasswordKey,password);
    } catch {
      $('status').textContent='浏览器禁止保存登录信息，关闭后可能需要重新登录。';
    }
    mergeCloudRecords(remote);
    $('cloud-connect').textContent='重新验证云端';
    await syncPendingEdits();
  }catch(e){
    cloudPassword=previousPassword;
    $('cloud-status').textContent='云端连接失败：'+e.message;
  }
}
$('cloud-connect').onclick=connectCloud;
$('cloud-sync').onclick=()=>cloudPassword?void syncPendingEdits():void connectCloud();
let refreshing = false;
let lastRefresh = 0;
async function refreshPublicRecords() {
  if(document.hidden||refreshing||Date.now()-lastRefresh<10000)return;
  if(cloudPassword){void syncPendingEdits();return}
  refreshing = true;
  lastRefresh = Date.now();
  try {
    const response = await fetch('./training-history.json',{cache:'no-cache',signal:AbortSignal.timeout(15000)});
    if (!response.ok) throw Error('训练记录加载失败');
    const data = await response.json();
    if (!Array.isArray(data.sessions)) throw Error('训练记录格式错误');
    const incoming = Object.create(null);
    for (const record of data.sessions) {
      if (!record || !/^\d{4}-\d{2}-\d{2}$/.test(record.date) ||
          !Array.isArray(record.exercises) || Object.hasOwn(incoming,record.date)) {
        throw Error('训练记录包含无效或重复日期');
      }
      incoming[record.date] = record;
    }
    if (needsMigration) {
      for (const [date, record] of Object.entries(sessions)) {
        if (!Object.hasOwn(incoming,date) && !Object.hasOwn(localEdits,date)) localEdits[date] = record;
      }
      try {
        localStorage.setItem(editsKey,JSON.stringify(localEdits));
        needsMigration = false;
      } catch {}
    }
    if (!needsMigration) {
      try { localStorage.setItem(publicCacheKey,JSON.stringify(incoming)); } catch {}
    }
    const merged = {...incoming,...localEdits};
    const selectedChanged = JSON.stringify(merged[selected]) !== JSON.stringify(sessions[selected]);
    sessions = merged;
    if (selectedChanged && !editorDirty() && !$('save').disabled) loadEditorDate(selected);
    else renderCalendar();
    $('cloud-status').textContent = '';
  } catch {
    $('cloud-status').textContent = '暂时无法读取公开训练记录，稍后会自动重试。';
  } finally {
    refreshing = false;
  }
}
window.addEventListener('online',refreshPublicRecords);
window.addEventListener('focus',refreshPublicRecords);
document.addEventListener('visibilitychange',refreshPublicRecords);
setInterval(refreshPublicRecords,60000);
function refreshToday() {
  const current = chinaDate.format(new Date());
  if (current === today) return;
  today = current;
  renderHeaderDate();
  renderCalendar();
}
document.addEventListener('visibilitychange',refreshToday);
setInterval(refreshToday,30000);
function openPage(page) {
  persistEditorDraft();
  const logIsOpen = page === 'log';
  $('checkin-page').hidden = page !== 'checkins';
  $('log-page').hidden = !logIsOpen;
  $('plan-page').hidden = page !== 'plans';
  for (const name of ['plans','checkins']) {
    $('open-' + name).setAttribute('aria-pressed',String(page === name));
  }
  $('compose-label').textContent = logIsOpen ? '记录动作' : '记录训练';
  compose.setAttribute('aria-controls',logIsOpen ? 'entry-sheet' : 'log-page');
  if (logIsOpen) compose.setAttribute('aria-haspopup','dialog');
  else compose.removeAttribute('aria-haspopup');
  renderHeaderDate();
  if (page === 'plans') renderPlan();
  if (page === 'checkins') renderCalendar();
  else if (page === 'log') {
    for (const wheel of wheels) wheel.align();
  }
  window.scrollTo({top:0,behavior:'instant'});
}
// Keep unfinished actions and notes separately from saved training records.
function editorSnapshot() {
  return {
    date:selected, draft:structuredClone(draft), hasChanges, editing, movement,
    note:$('note').value, noteOpen:$('session-note').open,
    exerciseNote:$('exercise-note').value,
    wheelValues:wheels.map(wheel => wheel.value()), updatedAt:Date.now()
  };
}
function renderDraftLink() {
  const pending = Object.values(editorDrafts).filter(item => item && /^\d{4}-\d{2}-\d{2}$/.test(item.date));
  pending.sort((a,b) => b.updatedAt - a.updatedAt);
  const latest = pending[0];
  $('resume-draft').hidden = !latest;
  if (latest) {
    $('resume-draft').textContent = '继续填写 ' + latest.date + ' 的草稿';
    $('resume-draft').onclick = () => {
      if (choose(latest.date)) openPage('log');
    };
  }
}
function persistEditorDraft() {
  if (!draftsReady) return true;
  if (editorDirty()) editorDrafts[selected] = editorSnapshot();
  else delete editorDrafts[selected];
  try {
    localStorage.setItem(draftKey,JSON.stringify(editorDrafts));
    $('draft-status').textContent = editorDirty() ? '草稿已自动保留，记得保存当天训练。' : '';
    renderDraftLink();
    return true;
  } catch {
    $('draft-status').textContent = '草稿自动保存失败，请先保存当天训练再退出。';
    return false;
  }
}
function restoreEditorDraft(iso) {
  const saved = editorDrafts[iso];
  $('draft-status').textContent = '';
  if (!saved || saved.date !== iso || !Array.isArray(saved.draft) ||
      !Array.isArray(saved.wheelValues) || saved.wheelValues.length !== 4) return;
  draft = structuredClone(saved.draft);
  hasChanges = Boolean(saved.hasChanges);
  editing = Number.isInteger(saved.editing) && saved.editing >= 0 && saved.editing < draft.length ? saved.editing : -1;
  setMovement(typeof saved.movement === 'string' ? saved.movement : '');
  wheels.forEach((wheel,index) => wheel.set(saved.wheelValues[index]));
  $('note').value = saved.note || '';
  $('session-note').open = Boolean(saved.noteOpen || saved.note);
  $('exercise-note').value = saved.exerciseNote || '';
  $('add-entry').textContent = editing < 0 ? '记入当天' : '更新记录';
  $('draft-status').textContent = '已恢复未保存的草稿，可以继续填写。';
}
// Save after handlers finish so every click, wheel change and note is captured.
for (const event of ['click','input','change','keydown']) {
  document.addEventListener(event,() => queueMicrotask(persistEditorDraft));
}
window.addEventListener('beforeunload',event => {
  persistEditorDraft();
  if (!editorDirty()) return;
  event.preventDefault();
  event.returnValue = '';
});
window.addEventListener('pagehide',persistEditorDraft);
document.addEventListener('visibilitychange',() => {
  if (document.hidden) persistEditorDraft();
});
$('open-plans').onclick = () => openPage('plans');
$('open-checkins').onclick = () => openPage('checkins');
renderPlan();
choose(today);
draftsReady = true;
renderDraftLink();
openPage('checkins');
refreshPublicRecords();
if(cloudPassword){$('cloud-connect').textContent='重新验证云端';void syncPendingEdits()}
</script>
